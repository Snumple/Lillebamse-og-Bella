function choose(c){
  if(c.go==='restart'){restart();return}

/* ---------- small games: pull (tap many times) and howl (hold) ---------- */
function buildMini(cfg){
  const wrap=document.createElement('div');wrap.className='mini';
  const btn=document.createElement('button');btn.type='button';btn.className='big';btn.textContent=cfg.label;
  const meter=document.createElement('div');meter.className='meter';const bar=document.createElement('i');meter.appendChild(bar);
  const hint=document.createElement('p');hint.className='hint';hint.textContent=cfg.hint;
  wrap.append(btn,meter,hint);choicesEl.appendChild(wrap);
  mini={cfg,fill:0,held:false,done:false,bar,btn};
  if(cfg.type==='pull'){btn.addEventListener('click',()=>pull())}
  else{
    const on=e=>{e.preventDefault();mini.held=true;btn.classList.add('on')};
    const off=()=>{if(mini){mini.held=false;btn.classList.remove('on')}};
    btn.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(t=>btn.addEventListener(t,off));
  }
  btn.focus({preventScroll:true});
}
function pull(){
  if(!mini||mini.done)return;
  mini.count=(mini.count||0)+1;mini.fill=Math.min(1,mini.count/mini.cfg.need);scene.tug=8;
  if(mini.count>=mini.cfg.need)finishMini();
}
function finishMini(){
  mini.done=true;mini.bar.style.width='100%';mini.btn.textContent='Hurra!';
  const go=mini.cfg.go;setTimeout(()=>{remember();show(go)},700);
}
function tickMini(){
  if(!mini||mini.done)return;
  if(mini.cfg.type==='howl'){mini.fill=mini.held?Math.min(1,mini.fill+1/150):Math.max(0,mini.fill-1/240);if(mini.fill>=1)finishMini()}
  mini.bar.style.width=(mini.fill*100).toFixed(1)+'%';
}
addEventListener('keydown',e=>{
  if(e.repeat&&!(mini&&mini.cfg.type==='howl'))return;
  if(e.code==='KeyE'){
    if(mini){if(mini.cfg.type==='pull')pull();else mini.held=true;e.preventDefault();return}
    const bs=choicesEl.querySelectorAll('.choice');if(bs.length===1){bs[0].click();e.preventDefault()}
    return;
  }
  const n=parseInt(e.key,10);
  if(n>=1&&n<=4&&!mini){const b=choicesEl.querySelectorAll('.choice')[n-1];if(b){b.click();e.preventDefault()}}
});
addEventListener('keyup',e=>{if(e.code==='KeyE'&&mini)mini.held=false});
$('restart').addEventListener('click',restart);

/* ---------- read aloud ---------- */
// Every paragraph has a recorded mp3 in lyd/, named by a hash of its text (made by tools/lag_lyd.py),
// so the voice sounds the same on every device. When reading is switched on, each new page is read.
const readBtn=$('read'),player=new Audio();
let readOn=false,queue=[],readTimer=0;
const speakText=p=>p.replace(/^– /,'');
function hashOf(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,'0')}
function playNext(){
  if(!readOn||!queue.length)return;
  player.src='lyd/'+hashOf(queue.shift())+'.mp3';
  player.play().catch(()=>{});
}
player.addEventListener('ended',()=>{readTimer=setTimeout(playNext,350)});
player.addEventListener('error',()=>{readTimer=setTimeout(playNext,50)});
function readPage(){stopReading();queue=[...textEl.querySelectorAll('p')].map(p=>speakText(p.textContent));playNext()}
function stopReading(){clearTimeout(readTimer);queue=[];try{player.pause()}catch(_){}}
function setReading(on){readOn=on;readBtn.textContent=on?'Slå av opplesing':'Les høyt';readBtn.setAttribute('aria-pressed',on);if(on)readPage();else stopReading()}
readBtn.addEventListener('click',()=>setReading(!readOn));
// leaving the story (back to all games, or closing the page) stops the voice at once
addEventListener('message',e=>{if(e.data&&e.data.type==='bella-stop')setReading(false)});
addEventListener('pagehide',()=>setReading(false));
document.querySelectorAll('a.home').forEach(a=>a.addEventListener('click',()=>setReading(false)));

const cv=$('pic'),ctx=cv.getContext('2d');let X=ctx,SC=1;
const VW=480,VH=240,TAU=Math.PI*2,INK='#2b1b3d';
const scene={t:0,tug:0};
function rng(seed){return function(){seed=(seed*16807)%2147483647;return seed/2147483647}}
function E(x,y,rx,ry,fill,st,rot){X.beginPath();X.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,TAU);if(fill){X.fillStyle=fill;X.fill()}if(st)X.stroke()}
function RR(x,y,w,h,r,fill,st){r=Math.min(r,w/2,h/2);X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();if(fill){X.fillStyle=fill;X.fill()}if(st)X.stroke()}
function fluff(cx,cy,rx,ry,n,k,fill,st){X.beginPath();for(let i=0;i<=n;i++){const a=i/n*TAU,px=cx+Math.cos(a)*rx,py=cy+Math.sin(a)*ry;if(i===0)X.moveTo(px,py);else{const m=(i-.5)/n*TAU;X.quadraticCurveTo(cx+Math.cos(m)*rx*k,cy+Math.sin(m)*ry*k,px,py)}}X.closePath();if(fill){X.fillStyle=fill;X.fill()}if(st)X.stroke()}
function blush(x,y,rx,ry){const a=X.globalAlpha;X.globalAlpha=a*.55;E(x,y,rx,ry,'#ff8fab',false);X.globalAlpha=a}
function star(x,y,r,fill){X.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;X.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}X.closePath();X.fillStyle=fill;X.fill()}
function eyes(x1,x2,y,r,mood,iris){
  for(const x of[x1,x2]){
    if(mood==='happy'||mood==='sing'){X.beginPath();X.moveTo(x-r,y+.5);X.quadraticCurveTo(x,y-r,x+r,y+.5);X.stroke()}
    else if(mood==='sleepy'){X.beginPath();X.moveTo(x-r,y);X.quadraticCurveTo(x,y+r*.8,x+r,y);X.stroke()}
    else{E(x,y,r*.8,r,'#1e0e06',false);if(iris)E(x+.2,y+.5,r*.56,r*.7,iris,false);E(x+r*.3,y-r*.35,r*.34,r*.38,'#fff',false);
      if(mood==='sad'){X.beginPath();X.moveTo(x-r,y-r*1.3);X.lineTo(x+r,y-r*1.7);X.stroke()}
      if(mood==='cross'){X.beginPath();X.moveTo(x-r,y-r*1.8);X.lineTo(x+r,y-r*1.2);X.stroke()}
      if(mood==='scared'){E(x,y,r*.95,r*1.15,null,true)}}
  }
}
function mouth(x,y,w,mood){
  if(mood==='sing'||mood==='scared'){E(x,y+.6,w*.45,w*.55,'#7a2b3a',true);return}
  X.beginPath();
  if(mood==='sad'||mood==='cross'){X.moveTo(x-w,y+1);X.quadraticCurveTo(x,y-1.4,x+w,y+1)}
  else{X.moveTo(x-w,y-.4);X.quadraticCurveTo(x,y+(mood==='happy'?2.4:1.6),x+w,y-.2)}
  X.stroke();
}
