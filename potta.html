}

<!-- What is said in the film. tools/lag_lyd.py records each line into lyd/, named by a hash of "who|text". -->
<script type="application/json" id="stemmer">
{"voices":{"bella":["nb-NO-PernilleNeural","+5%","+20Hz"],"bamse":["nb-NO-FinnNeural","+5%","+25Hz"]},
 "lines":{"bella":["Kom, Lillebamse! Vi går på do.","Trykk på Lillebamse, så setter han seg på potta.","Nå tørker vi med dopapir.","Så tømmer vi potta i doen og trekker ned!","Og så vasker vi hendene med såpe.","Så flink du er, Lillebamse!","Å, nå må jeg også tisse!","Trykk, og tell dråpene sammen med meg!","Så mange dråper!","Hurra! Vi tisset på do!",
            "En!","To!","Tre!","Fire!","Fem!","Seks!","Sju!","Åtte!","Ni!","Ti!"],
          "bamse":["Å nei! Jeg må tisse!","Nå kommer tisset! Trykk, så teller vi hver eneste dråpe.","Trykk på Bella, så klatrer hun opp på doen.","Ferdig!","Tørk med dopapir!","Trekk ned!","Vask hendene!","Rene hender!","Så mange dråper!","Hurra! Vi tisset på do!",
            "En!","To!","Tre!","Fire!","Fem!","Seks!","Sju!","Åtte!","Ni!","Ti!"]}}
</script>
<script>
(function(){
'use strict';
const cv=document.getElementById('film'),ctx=cv.getContext('2d');
let X=ctx,SC=1;
const VW=480,VH=264,INK='#21344a',TAU=Math.PI*2,FONT='Fredoka,"Trebuchet MS","Segoe UI",sans-serif';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rr=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const VO=JSON.parse(document.getElementById('stemmer').textContent);
const NUM=['En!','To!','Tre!','Fire!','Fem!','Seks!','Sju!','Åtte!','Ni!','Ti!'];

/* ---------- where things stand in the bathroom ---------- */
const FLOOR=210,SINK=66,POTTY=222,LOO=380,STOOL=346,ROLL=436;
// Bella and Lillebamse: x,y is where the feet are; path is a list of points to walk to, one after the other
const B={x:40,y:FLOOR,dir:1,sit:false,dance:false,path:[],name:'bella'};
const L={x:120,y:FLOOR,dir:1,sit:false,dance:false,path:[],name:'bamse'};

/* ---------- the film, beat by beat ----------
   say: the lines in this beat. go: who walks where when the beat starts.
   wait: 'tap' waits for a tap (then act runs), 'drops' counts one drop per tap until the potty is done.
   who: whose turn it is to sit on the potty or the loo, counter: who counts the drops out loud. */
const BEATS=[
 {say:[['bamse','Å nei! Jeg må tisse!']],go:()=>{L.dance=true}},
 {say:[['bella','Kom, Lillebamse! Vi går på do.']],go:()=>{L.dance=false;walk(B,[[118,FLOOR]]);walk(L,[[POTTY-44,FLOOR]])}},
 {say:[['bella','Trykk på Lillebamse, så setter han seg på potta.']],wait:'tap',hint:()=>[L.x,L.y-70],act:()=>{walk(L,[[POTTY-2,FLOOR-10]],()=>{L.sit=true})}},
 {say:[['bamse','Nå kommer tisset! Trykk, så teller vi hver eneste dråpe.']],wait:'drops',who:L,counter:'bella',hint:()=>[POTTY+140,100]},
 {say:[['bamse','Ferdig!'],['bella','#'],['bella','Så mange dråper!']],total:true},
 {say:[['bella','Nå tørker vi med dopapir.']],wait:'tap',hint:()=>[ROLL,120],act:()=>{S.paper=80;sfx('paper')}},
 {say:[['bella','Så tømmer vi potta i doen og trekker ned!']],go:()=>{L.sit=false;walk(L,[[POTTY-44,FLOOR]])},wait:'tap',hint:()=>[LOO+24,112],act:()=>{S.flush=110;S.pool=0;sfx('flush')}},
 {say:[['bella','Og så vasker vi hendene med såpe.']],wait:'tap',hint:()=>[SINK,100],act:()=>{walk(B,[[POTTY-50,FLOOR]]);walk(L,[[SINK+46,FLOOR]],()=>{L.dir=-1;S.wash=130;sfx('wash')})}},
 {say:[['bamse','Rene hender!'],['bella','Så flink du er, Lillebamse!']],go:()=>{S.stars.push('bamse');sfx('star')}},
 {say:[['bella','Å, nå må jeg også tisse!']],go:()=>{B.dance=true;walk(L,[[POTTY+10,FLOOR]])}},
 {say:[['bamse','Trykk på Bella, så klatrer hun opp på doen.']],wait:'tap',hint:()=>[B.x,B.y-70],act:()=>{B.dance=false;walk(B,[[STOOL,FLOOR-12],[LOO-4,FLOOR-30]],()=>{B.sit=true;B.dir=1})}},
 {say:[['bella','Trykk, og tell dråpene sammen med meg!']],wait:'drops',who:B,counter:'bamse',hint:()=>[LOO-150,100]},
 {say:[['bella','Ferdig!'],['bamse','#'],['bamse','Så mange dråper!']],total:true},
 {say:[['bamse','Tørk med dopapir!']],wait:'tap',hint:()=>[ROLL,120],act:()=>{S.paper=80;sfx('paper')}},
 {say:[['bamse','Trekk ned!']],go:()=>{B.sit=false;walk(B,[[STOOL,FLOOR-12],[STOOL-40,FLOOR]])},wait:'tap',hint:()=>[LOO+24,112],act:()=>{S.flush=110;S.pool=0;sfx('flush')}},
 {say:[['bamse','Vask hendene!']],wait:'tap',hint:()=>[SINK,100],act:()=>{walk(L,[[POTTY+20,FLOOR]]);walk(B,[[SINK+46,FLOOR]],()=>{B.dir=-1;S.wash=130;sfx('wash')})}},
 {say:[['bella','Hurra! Vi tisset på do!'],['bamse','Hurra! Vi tisset på do!']],go:()=>{S.stars.push('bella');sfx('star');walk(B,[[POTTY-40,FLOOR]]);walk(L,[[POTTY+30,FLOOR]])}}];
const S={mode:'start',t:0,beat:-1,b:null,q:[],talking:null,talkT:0,ready:false,busy:0,need:0,count:0,drops:[],splash:[],pool:0,shown:0,paper:0,flush:0,wash:0,bubbles:[],stars:[],confetti:[],caption:null};

/* ---------- sound ---------- */
let AC=null,voiceOut=null,current=null;const buffers={};
function hashOf(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,'0')}
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();voiceOut=AC.createGain();voiceOut.connect(AC.destination);
  for(const w in VO.lines)for(const s of VO.lines[w]){const k=w+'|'+s;fetch('lyd/'+hashOf(k)+'.mp3').then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(b=>new Promise((ok,no)=>{const r=AC.decodeAudioData(b,ok,no);if(r&&r.catch)r.catch(no)})).then(buf=>{buffers[k]=buf}).catch(()=>{})}}catch(_){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume()}
function speak(who,s){const k=who+'|'+s;if(current){try{current.stop()}catch(_){}current=null}
  if(AC&&buffers[k]){const src=AC.createBufferSource();src.buffer=buffers[k];src.connect(voiceOut);src.start();current=src;return buffers[k].duration}return .8+s.length*.06}
function tone(f0,f1,len,type,vol,at){if(!AC)return;const t=AC.currentTime+(at||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+len);g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+len+.02)}
function noise(len,from,to,vol){if(!AC)return;const n=Math.floor(AC.sampleRate*len),buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime;src.buffer=buf;f.type='bandpass';f.frequency.setValueAtTime(from,t);f.frequency.exponentialRampToValueAtTime(to,t+len);g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(vol,t+.15);g.gain.exponentialRampToValueAtTime(.001,t+len);src.connect(f);f.connect(g);g.connect(AC.destination);src.start(t)}
function sfx(k){if(!AC)return;
  if(k==='drop')tone(1400,500,.12,'sine',.16);
  else if(k==='plopp')tone(700,260,.1,'sine',.12);
  else if(k==='paper')noise(.5,3000,1500,.08);
  else if(k==='flush'){noise(1.8,500,2400,.22);for(let i=0;i<6;i++)tone(300+i*60,180,.25,'sine',.05,.2+i*.2)}
  else if(k==='wash')for(let i=0;i<8;i++)tone(900+Math.random()*700,1800,.08,'sine',.05,i*.18);
  else if(k==='star')[523,659,784,1047].forEach((f,i)=>tone(f,f,.45,'triangle',.07,i*.11))}

/* ---------- playing ---------- */
function walk(c,pts,done){c.path=pts.map(p=>p.slice());c.done=done||null}
function start(){audio();S.mode='loading';S.t=0}
function play(){Object.assign(B,{x:40,y:FLOOR,dir:1,sit:false,dance:false,path:[],done:null});Object.assign(L,{x:120,y:FLOOR,dir:1,sit:false,dance:false,path:[],done:null});
  Object.assign(S,{mode:'film',t:0,beat:-1,b:null,q:[],talking:null,talkT:0,ready:false,busy:0,count:0,drops:[],splash:[],pool:0,shown:0,paper:0,flush:0,wash:0,bubbles:[],stars:[],confetti:[],caption:null});nextBeat()}
function nextBeat(){S.beat++;S.ready=false;S.busy=0;
  if(S.beat>=BEATS.length){S.mode='end';S.t=0;S.b=null;S.caption=null;sfx('star');return}
  const b=S.b=BEATS[S.beat];if(b.go)b.go();
  if(b.wait==='drops'){S.need=rr(5,10);S.count=0;S.pool=0;S.shown=0}
  // '#' is the number of drops just counted, said again
  S.q=b.say.map(([w,s])=>[w,s==='#'?NUM[S.count-1]:s]);S.talkT=0}
function sayNext(){const[w,s]=S.q.shift();S.talking=w;S.caption={who:w,s};S.talkT=Math.round(speak(w,s)*60)+14}
function tap(){if(S.mode==='start'){start();return}if(S.mode==='end'){if(S.t>60){audio();play()}return}
  if(S.mode!=='film')return;audio();const b=S.b;if(!b||!S.ready)return;
  if(b.wait==='tap'&&!S.busy){S.busy=1;S.ready=false;b.act()}
  else if(b.wait==='drops'&&S.count<S.need&&!S.drops.some(d=>d.y<d.end-10))drop()}
function drop(){const b=S.b;S.count++;S.drops.push({y:-30,v:.6,end:22-Math.min(S.count,10)*1.6});sfx('drop');
  speak(b.counter,NUM[S.count-1]);S.talking=b.counter;S.talkT=40;S.caption={who:b.counter,s:NUM[S.count-1]};S.shown=60}
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.focus();tap()});
addEventListener('keydown',e=>{if(['Space','Enter','KeyE'].includes(e.code)){e.preventDefault();tap()}});
const goHome=()=>{if(window.parent!==window)parent.postMessage({type:'bella-home'},'*');else location.href='index.html'};
for(const el of[document.getElementById('fullhome'),...document.querySelectorAll('a.home')])el.addEventListener('click',e=>{e.preventDefault();goHome()});

function moveChar(c){if(!c.path.length)return;const[tx,ty]=c.path[0],dx=tx-c.x,dy=ty-c.y,d=Math.hypot(dx,dy);
  if(Math.abs(dx)>.5)c.dir=dx>0?1:-1;
  if(d<=1.8){c.x=tx;c.y=ty;c.path.shift();if(!c.path.length&&c.done){const f=c.done;c.done=null;f()}}else{c.x+=dx/d*1.8;c.y+=dy/d*1.8}}
const still=()=>!B.path.length&&!L.path.length&&!S.paper&&!S.flush&&!S.wash;
function update(){S.t++;
  if(S.mode==='loading'){if(Object.keys(buffers).length>=40||S.t>150)play();return}
  moveChar(B);moveChar(L);
  if(S.paper)S.paper--;if(S.flush)S.flush--;if(S.shown)S.shown--;
  if(S.wash){S.wash--;if(S.t%5===0)S.bubbles.push({x:SINK-26+Math.random()*52,y:146,v:.4+Math.random()*.6,r:3+Math.random()*4,ph:Math.random()*TAU})}
  for(const q of S.bubbles)q.y-=q.v;S.bubbles=S.bubbles.filter(q=>q.y>60);
  for(const d of S.drops){d.v+=.18;d.y+=d.v;if(d.y>=d.end){d.gone=true;S.pool++;sfx('plopp');for(let i=0;i<5;i++)S.splash.push({x:(Math.random()-.5)*4,y:d.end,vx:(Math.random()-.5)*2.4,vy:-1-Math.random()*1.6,l:22})}}
  S.drops=S.drops.filter(d=>!d.gone);for(const p of S.splash){p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.l--}S.splash=S.splash.filter(p=>p.l>0);
  if(S.mode==='end'||S.b&&S.b.total)if(S.t%4===0)S.confetti.push({x:Math.random()*VW,y:-6,v:1+Math.random(),c:['#ff5a8a','#ffd23f','#4fc3ff','#6fdc6f'][rr(0,3)],r:Math.random()*TAU});
  for(const c of S.confetti){c.y+=c.v;c.r+=.1}S.confetti=S.confetti.filter(c=>c.y<VH+6);
  if(S.mode!=='film')return;
  // the lines play one after another; then the beat waits for a tap, or moves on by itself
  if(S.talkT>0){S.talkT--;if(S.talkT===0)S.talking=null;return}
  if(S.q.length){sayNext();return}
  const b=S.b;
  if(b.wait==='tap'){if(S.busy){if(still()&&++S.busy>30)nextBeat()}else if(still())S.ready=true;return}
  if(b.wait==='drops'){if(still())S.ready=true;if(S.count>=S.need&&!S.drops.length&&++S.busy>40)nextBeat();return}
  if(still()&&++S.busy>30)nextBeat()}

/* ---------- drawing ---------- */
function E(x,y,rx,ry,fill,st){X.beginPath();X.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,TAU);if(fill){X.fillStyle=fill;X.fill()}if(st)X.stroke()}
function RR(x,y,w,h,r,fill,st){r=Math.min(r,w/2,h/2);X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();if(fill){X.fillStyle=fill;X.fill()}if(st)X.stroke()}
function fluff(cx,cy,rx,ry,n,k,fill,st){X.beginPath();for(let i=0;i<=n;i++){const a=i/n*TAU,px=cx+Math.cos(a)*rx,py=cy+Math.sin(a)*ry;if(i===0)X.moveTo(px,py);else{const m=(i-.5)/n*TAU;X.quadraticCurveTo(cx+Math.cos(m)*rx*k,cy+Math.sin(m)*ry*k,px,py)}}X.closePath();if(fill){X.fillStyle=fill;X.fill()}if(st)X.stroke()}
function txt(s,x,y,size,fill,outline,wt){X.font=`${wt||700} ${size}px ${FONT}`;X.textAlign='center';X.textBaseline='middle';X.lineJoin='round';if(outline){X.strokeStyle=outline;X.lineWidth=Math.max(2,size*.28);X.strokeText(s,x,y)}X.fillStyle=fill;X.fillText(s,x,y)}
function wrapLines(s,max,size){X.font=`700 ${size}px ${FONT}`;const out=[];let line='';for(const w of s.split(' ')){const t=line?line+' '+w:w;if(X.measureText(t).width>max&&line){out.push(line);line=w}else line=t}if(line)out.push(line);return out}
function star(x,y,r,fill){X.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;X.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}X.closePath();X.fillStyle=fill;X.fill();X.stroke()}
function drip(x,y,s,fill){X.beginPath();X.moveTo(x,y-s*1.6);X.quadraticCurveTo(x+s,y-s*.2,x+s,y+s*.2);X.arc(x,y+s*.2,s,0,Math.PI);X.quadraticCurveTo(x-s,y-s*.2,x,y-s*1.6);X.closePath();X.fillStyle=fill;X.fill();X.stroke()}
function blush(x,y,rx,ry){const a=X.globalAlpha;X.globalAlpha=a*.55;E(x,y,rx,ry,'#ff8fab',false);X.globalAlpha=a}
function eye(x,y,o,r){if(o.happy){X.beginPath();X.moveTo(x-r,y+.4);X.quadraticCurveTo(x,y-r,x+r,y+.4);X.stroke()}else{E(x,y,r*.85,r,'#1a0e08',false);E(x+r*.3,y-r*.35,r*.35,r*.35,'#fff',false)}}
function drawBella(x,y,dir,o){X.save();X.translate(x,y);X.scale(dir,1);X.lineWidth=1.3;X.strokeStyle='#2b211c';X.lineJoin='round';X.lineCap='round';
  const fur='#7d6d61',dk='#5e5048',lt='#b4a28c',cream='#d8c6a6';
  fluff(-9.5,-12.5,3.2,2.8,6,1.25,fur,true);RR(-7,-8,6,8,3,cream,true);RR(2,-8,6,8,3,cream,true);fluff(0,-12,10,7.5,10,1.12,fur,true);E(3,-10,5.5,4.5,cream,false);
  for(const[ex,ey,rot]of[[-5,-33,-.28],[7,-34,.2]]){X.save();X.translate(ex,ey);X.rotate(rot);X.beginPath();X.moveTo(-5,5);X.quadraticCurveTo(-3,-7,0,-9);X.quadraticCurveTo(3,-7,5,5);X.closePath();X.fillStyle=dk;X.fill();X.stroke();X.restore()}
  fluff(2,-24,12.5,10.5,14,1.1,fur,true);E(-4,-20,5.5,4.2,lt,false);E(8,-20.5,7.2,5,cream,true);E(13.6,-22.6,2.9,2.2,'#14100e',false);
  if(o.talk)E(10.8,-17.6,2,2.2,'#7a2b3a',true);else if(o.oh)E(10.8,-17.6,1.4,1.6,'#7a2b3a',true);else{X.beginPath();X.moveTo(8.5,-18.6);X.quadraticCurveTo(10.5,-16.6,12.6,-18.4);X.stroke()}eye(0,-26,o,2.8);eye(8.4,-26.6,o,2.8);blush(-2,-20.6,2.8,1.7);X.restore()}
