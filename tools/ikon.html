<script>
const S=+(new URLSearchParams(location.search).get('s')||512),cv=document.getElementById('c');cv.width=cv.height=S;
const X=cv.getContext('2d'),TAU=Math.PI*2;X.scale(S/100,S/100);X.lineJoin='round';X.lineCap='round';
function E(x,y,rx,ry,fill,st,rot){X.beginPath();X.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,TAU);if(fill){X.fillStyle=fill;X.fill()}if(st)X.stroke()}
function RR(x,y,w,h,r,fill,st){r=Math.min(r,w/2,h/2);X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();if(fill){X.fillStyle=fill;X.fill()}if(st)X.stroke()}
function fluff(cx,cy,rx,ry,n,k,fill,st){X.beginPath();for(let i=0;i<=n;i++){const a=i/n*TAU,px=cx+Math.cos(a)*rx,py=cy+Math.sin(a)*ry;if(i===0)X.moveTo(px,py);else{const m=(i-.5)/n*TAU;X.quadraticCurveTo(cx+Math.cos(m)*rx*k,cy+Math.sin(m)*ry*k,px,py)}}X.closePath();if(fill){X.fillStyle=fill;X.fill()}if(st)X.stroke()}
function blush(x,y,rx,ry){X.globalAlpha=.55;E(x,y,rx,ry,'#ff8fab',false);X.globalAlpha=1}
function happyEye(x,y,w){X.beginPath();X.moveTo(x-w,y+.5);X.quadraticCurveTo(x,y-w,x+w,y+.5);X.stroke()}
function bella(x,y,s){

  for(const[ex,ey,rot]of[[-5,-33,-.28],[7,-34,.2]]){X.save();X.translate(ex,ey);X.rotate(rot);

  fluff(2,-24,12.5,10.5,14,1.1,fur,true);

  happyEye(0,-26,2.8);happyEye(8.4,-26.6,2.8);blush(-2,-20.6,2.8,1.7);X.restore();

function bear(x,y,s){

  X.beginPath();X.moveTo(4.6,-17.8);X.quadraticCurveTo(7.2,-15.4,9.6,-17.6);X.stroke();
  happyEye(-.5,-24.5,2.3);happyEye(8.6,-25,2.3);blush(-3.4,-19.6,2.6,1.6);X.restore();
}
const g=X.createLinearGradient(0,0,0,100);g.addColorStop(0,'#9b7cff');g.addColorStop(1,'#6a4ad0');X.fillStyle=g;X.fillRect(0,0,100,100);
['#ff5a5a','#ff9f1c','#ffd23f','#6fdc6f','#4fc3ff'].forEach((c,i)=>{X.strokeStyle=c;X.lineWidth=3.2;X.beginPath();X.arc(50,84,40-i*3.2,Math.PI,0);X.stroke()});
X.fillStyle='#7ed957';X.fillRect(0,80,100,20);X.fillStyle='rgba(0,0,0,.12)';X.fillRect(0,80,100,2);

</script></body></html>
